name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, for advisories published since the last push (bun audit).
  schedule:
    - cron: '17 6 * * 1'

# Actions are pinned by commit, which a tag can't be moved off; the comment
# names the release it was. The token reads the repo and nothing else.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: bun install --frozen-lockfile

      # Fails on any advisory against a package in bun.lock, dev ones too:
      # they build what's served. Deadlines: SECURITY.md.
      - run: bun audit

      - run: bun run lint

      - run: bun run check

      - run: bun test

      # Building loads the server code, which opens a database.
      - run: PAD_DB="$RUNNER_TEMP/pad.db" bun run build

  # The release's image, both architectures, not pushed: a broken Dockerfile
  # shows here, not on a tag. The amd64 one is started as release.yml does.
  docker:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: pad:ci

      - name: Run the image
        run: |
          docker run -d --name pad -p 5512:5512 \
            --read-only --cap-drop ALL --security-opt no-new-privileges pad:ci
          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5512/_/limits || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs pad
          [ "$code" = 200 ] || { echo "No answer from /_/limits"; exit 1; }
