name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build, e.g. v0.1.0'
        required: true

# Each job gets only what it uses. Actions are pinned by commit, as in
# ci.yml.
permissions: {}

env:
  IMAGE: ghcr.io/nasreddinhodja/pad
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # actions/attest: OIDC token for the Sigstore certificate, storing the
      # attestation, and the artifact storage record.
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: The tag is package.json's version
        run: |
          version=$(jq -r .version package.json)
          [ "$TAG" = "v$version" ] || { echo "$TAG is not v$version"; exit 1; }

      # The commit's time: the same tag builds the same client files
      # (vite.config.ts), whose hashes the release publishes.
      - name: Source date
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.3 and latest from tag v1.2.3.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}

      # The build stage runs on the runner's platform and only copies into
      # the arm64 base, so nothing runs under emulation.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Signed build provenance, checked with `gh attestation verify oci://…`.
      - id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # Attached to the release: gh verifies with a bundle given to it
      # without logging in, which deploy/pad-update relies on; fetching one
      # needs a login (cli/cli#11803).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-attestation
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error

  # The pushed image, started on each architecture as install.org runs it:
  # it has to answer, or the release fails.
  smoke:
    needs: image
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: read
    steps:
      # A package new to ghcr may start out private.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the image
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          docker run -d --name pad -p 5512:5512 \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$REF"
          for _ in $(seq 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5512/_/limits || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          docker logs pad
          [ "$code" = 200 ] || { echo "No answer from /_/limits"; exit 1; }

  release:
    needs: [image, smoke]
    runs-on: ubuntu-24.04
    permissions:
      # The release and its files.
      contents: write
      packages: read
      # actions/attest on client-files.sha256, as in image.
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          # git-cliff needs the tags and history for the release notes.
          fetch-depth: 0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The client files as the image serves them, for
      # scripts/check-instance.ts.
      - name: Hash the client files
        env:
          REF: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
        run: |
          docker create --name pad "$REF"
          docker cp pad:/app/client client
          find client -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum \
            | sed 's|  client/|  |' > client-files.sha256

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: client-files.sha256

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-attestation
          path: image-attestation

      - run: mv image-attestation/* image-attestation.json

      - name: Generate release notes
        id: notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest --strip header

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          files: |
            client-files.sha256
            image-attestation.json
          body: ${{ steps.notes.outputs.content }}
